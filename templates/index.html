{% extends "base.html" %}
{% block content %}
<div class="card"><h2>Registrar gasto</h2>
<form method="post" class="inline">
<label>Fecha<input type="date" name="fecha" value="{{ hoy }}" required></label>
<label style="flex:3">Descripción<input name="descripcion" required></label>
<label>Monto<input type="number" step="0.01" min="0.01" name="monto" required></label>
<button>Guardar</button></form></div>
<div class="card"><h2>Mis gastos</h2>
<table><tr><th>Fecha</th><th>Descripción</th><th class="num">Monto</th><th></th></tr>
{% for g in gastos %}
<tr><td>{{ g.fecha }}</td><td>{{ g.descripcion }}</td><td class="num">{{ "%.2f"|format(g.monto) }}</td>
<td><form method="post" action="{{ url_for('eliminar', gasto_id=g.id) }}"><button class="del">Eliminar</button></form></td></tr>
{% else %}<tr><td colspan="4">Aún no hay gastos registrados.</td></tr>{% endfor %}
</table></div>
{% endblock %}
