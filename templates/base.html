<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Control de Gastos{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
{% if session.usuario %}
<nav><strong>💰 Control de Gastos</strong>
<a href="{{ url_for('index') }}">Gastos</a>
<a href="{{ url_for('reporte') }}">Reporte</a>
<a href="{{ url_for('logout') }}">Salir</a></nav>
{% endif %}
<main>
{% for cat, m in get_flashed_messages(with_categories=true) %}<div class="msg {{ cat }}">{{ m }}</div>{% endfor %}
{% block content %}{% endblock %}
</main></body></html>
